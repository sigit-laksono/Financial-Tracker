name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sigit-laksono/financial-tracker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install dependencies and typecheck
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

          SSH_OPTS="-i ~/.ssh/deploy_key -p $VPS_PORT"
          TARGET="$VPS_USER@$VPS_HOST"

          ssh $SSH_OPTS "$TARGET" "mkdir -p /home/$VPS_USER/financial-tracker"
          scp -i ~/.ssh/deploy_key -P "$VPS_PORT" compose.prod.yml "$TARGET:/home/$VPS_USER/financial-tracker/compose.yml"

          printf '%s\n' "$GHCR_TOKEN" | ssh $SSH_OPTS "$TARGET" "
            set -euo pipefail
            docker login ghcr.io -u '$GHCR_USER' --password-stdin
            cd /home/$VPS_USER/financial-tracker
            docker compose pull
            docker compose up -d --remove-orphans --wait
            docker logout ghcr.io >/dev/null 2>&1 || true
            docker image prune -f
            curl -fsS http://127.0.0.1:3001/api/health
          "
          rm -f ~/.ssh/deploy_key
